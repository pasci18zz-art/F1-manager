<div class="app">
  <header class="top" id="top">
    <div class="toprow">
      <button type="button" class="pill" id="savepill" data-act="sheet-saves" aria-label="Spielstand und Saison wechseln">
        <span class="dot"></span><span class="t" id="savepill-t">Karriere</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="round" id="roundinfo"></span>
    </div>
    <h1 class="title" id="title">Wertung</h1>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab"></div>
  <div class="sh"><h3 id="sheet-title"></h3>
    <button type="button" class="iconbtn" data-act="sheet-close" aria-label="Schließen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sb" id="sheet-body"></div>
  <div class="sf" id="sheet-foot" hidden></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<input type="file" id="file-json" accept=".json,.txt,application/json,text/plain" hidden>
<input type="file" id="file-img" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
<input type="file" id="file-logo" accept="image/*" hidden>
